<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>SupplyCollect - Receipts</title>
  <link rel="icon" type="image/png" href="./logo.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav>
    <a class="logo" href="index.html">SupplyCollect</a>
    <div class="nav-buttons" id="navButtons"></div>
  </nav>

  <div class="shop-content">
    <h2 class="shop-section-title">Receipts</h2>
    <div id="receiptsContainer" style="max-width:1000px; margin: 0 auto;"></div>
  </div>

  <script src="script.js"></script>
  <script>
    function formatDate(iso) {
      const d = new Date(iso);
      return d.toLocaleString();
    }

    function renderReceipts() {
      const container = document.getElementById('receiptsContainer');
      const user = getCurrentUser();
      if (!user) {
        container.innerHTML = '<div style="color:var(--text-muted); text-align:center; margin-top:40px;">Please <a href="login.html">log in</a> to view your receipts.</div>';
        return;
      }

      const allOrders = JSON.parse(localStorage.getItem('supplycollectOrders') || '[]');
      const myOrders = allOrders.filter(o => o.userEmail === user.email).sort((a,b) => b.createdAt.localeCompare(a.createdAt));

      if (myOrders.length === 0) {
        container.innerHTML = '<div style="color:var(--text-muted); text-align:center; margin-top:40px;">No orders yet. <a href="shop.html">Start shopping</a>.</div>';
        return;
      }

      container.innerHTML = myOrders.map(order => {
        const itemsHtml = order.items.map(it => `
          <div style="display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px solid var(--border-color);">
            <div style="font-weight:700;">${it.name} x${it.qty}</div>
            <div style="color:var(--text-muted);">$${(it.price * it.qty).toFixed(2)}</div>
          </div>
        `).join('');

        return `
          <div style="background:var(--bg-surface); border:1px solid var(--border-color); border-radius:12px; padding:16px; margin-bottom:16px;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
              <div style="font-weight:800;">Order ${order.id}</div>
              <div style="color:var(--text-muted); font-size:0.9rem;">${formatDate(order.createdAt)}</div>
            </div>
            <div style="margin-bottom:8px;">Pickup room: <strong>${order.room || '—'}</strong></div>
            <div>${itemsHtml}</div>
            <div style="display:flex; justify-content:space-between; align-items:center; margin-top:12px;">
              <div style="color:var(--text-muted);">ETA: ${order.estimatedTime} mins</div>
              <div style="font-weight:800; color:#60A5FA;">Total: $${order.total.toFixed(2)}</div>
            </div>
          </div>
        `;
      }).join('');
    }

    document.addEventListener('DOMContentLoaded', function() {
      updateNav();     // from script.js
      renderReceipts();
    });
  </script>
</body>
</html>
