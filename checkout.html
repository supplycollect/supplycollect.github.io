<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SupplyCollect - Checkout</title>
    <link rel="icon" type="image/png" href="./logo.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="fullpage-top">
        <a href="cart.html" class="back-btn">&larr; Back to cart</a>
    </div>

    <div class="checkout-content" id="checkoutForm">
        <h2 style="color:var(--text-main); font-size:2rem; font-weight:700; margin-top:0;">Checkout</h2>

        <p style="color:var(--text-light); font-size:0.95rem; margin-bottom:16px;">Select your pickup room.</p>
        <div class="block-grid" id="roomGrid"></div>
        <button class="submit-btn" id="confirmRoomBtn" onclick="placeOrder()" disabled>Confirm &amp; Place Order</button>
    </div>

    <div class="order-confirm" id="orderConfirmBox" style="display:none;">
        <div style="font-size:3.5rem; margin-bottom:12px;">✅</div>
        <h2 style="color:var(--text-main); font-size:2rem; font-weight:700; margin-top:0;">Order Placed!</h2>
        <p id="orderConfirmText" style="color:var(--text-light); line-height:1.5;"></p>
        <div class="time-box">
            <h4 style="margin:0 0 8px 0; color:var(--text-muted); font-size:0.85rem; text-transform:uppercase;">Estimated Ready Time</h4>
            <div class="time-value" id="estimatedTimeDisplay">-- mins</div>
        </div>
        <a href="shop.html" style="text-decoration:none;">
            <button class="submit-btn" style="max-width:250px; margin:24px auto 0 auto;">Back to Shop</button>
        </a>
    </div>

    <script src="script.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", initCheckout);
    </script>
</body>
</html>
